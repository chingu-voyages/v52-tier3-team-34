name: Client Build Check

on:
  pull_request:
    branches:
      - development

jobs:
  build-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: client
        run: npm ci

      - name: Build Client
        working-directory: client
        run: npm run build
